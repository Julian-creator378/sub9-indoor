<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Sub9 Indoor-Trainer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,500;0,600;0,700;1,700&family=Source+Sans+3:wght@400;600;700&display=swap">
<style>
/* Farben und Schriften wie in Sub9 */
:root{
  --bg:#edf0f3; --surface:#ffffff; --surface-2:#f5f7f9;
  --ink:#141e28; --ink-2:#475563; --ink-3:#7a8794; --line:#d7dde3;
  --accent:#c2365b; --done:#0ca30c; --crit:#d03b3b;
  --f-disp:"Barlow Condensed","Arial Narrow","Roboto Condensed",system-ui,sans-serif;
  --f-body:"Source Sans 3",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:12px; color-scheme:light;
  --z1:#8a96a2; --z2:#2a78d6; --z3:#1baf7a; --z4:#c9a400; --z5:#eda100; --z6:#eb6834; --z7:#d03b3b;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0b1015; --surface:#131a21; --surface-2:#18212a;
  --ink:#e5ebf0; --ink-2:#a6b3bf; --ink-3:#717f8c; --line:#25303a;
  --accent:#ef6f8c; color-scheme:dark;
  --z1:#717f8c; --z2:#3987e5; --z3:#199e70; --z4:#b39200; --z5:#c98500; --z6:#d95926; --z7:#e05a5a;
}}
:root[data-theme="dark"]{
  --bg:#0b1015; --surface:#131a21; --surface-2:#18212a;
  --ink:#e5ebf0; --ink-2:#a6b3bf; --ink-3:#717f8c; --line:#25303a;
  --accent:#ef6f8c; color-scheme:dark;
  --z1:#717f8c; --z2:#3987e5; --z3:#199e70; --z4:#b39200; --z5:#c98500; --z6:#d95926; --z7:#e05a5a;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg)}
body{color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px;border-radius:6px}
h1,h2,h3{margin:0}
.top{border-bottom:1px solid var(--line)}
.top-in{max-width:960px;margin:0 auto;padding:0 16px;min-height:56px;display:flex;align-items:center;gap:8px}
.mark{font:italic 700 26px/1 var(--f-disp);letter-spacing:.01em}
.mark b{color:var(--accent);font-weight:700}
.brand-sub{font:600 13px/1 var(--f-disp);letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3)}
.app{max-width:960px;margin:0 auto;padding:16px 16px 40px}
.view{display:grid;grid-template-columns:minmax(0,1fr);gap:16px;align-items:start}
@media (min-width:800px){.view{grid-template-columns:repeat(2,minmax(0,1fr))}.view>div:first-child,.view>.notice,.view>.tiles{grid-column:1/-1}}
.eyebrow{font:600 12px/1.2 var(--f-disp);letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);margin:0}
.vh{font:700 26px/1.1 var(--f-disp)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:10px}
.panel h3{font:700 19px var(--f-disp)}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;display:flex;flex-direction:column;gap:3px;min-width:0}
.tile .k{font-size:12.5px;color:var(--ink-2)}
.tile .v{font:700 30px/1 var(--f-disp);font-variant-numeric:tabular-nums}
.tile .v small{font:600 15px var(--f-disp);color:var(--ink-2);margin-left:3px}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.btn{appearance:none;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 12px;font-weight:600;font-size:14px;cursor:pointer}
.btn.primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn:disabled{opacity:.5;cursor:default}
.ibtn{appearance:none;border:1px solid var(--line);background:var(--surface);width:38px;height:38px;border-radius:10px;display:grid;place-items:center;cursor:pointer}
.ibtn:disabled{opacity:.4;cursor:default}
.dt-in{border:1px solid var(--line);border-radius:10px;background:var(--surface-2);color:var(--ink);padding:9px 10px;font:inherit;font-size:15px;min-width:0}
.notice{display:flex;flex-direction:column;gap:8px;align-items:flex-start;background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;font-size:13.5px;color:var(--ink-2)}
.notice p{margin:0}
.note{font-size:13px;color:var(--ink-3);margin:0}
.explain{font-size:13.5px;color:var(--ink-2);margin:0;max-width:65ch}
.muted{color:var(--ink-3);margin:0;font-size:14px}
.in-log{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px;font-size:13.5px;font-variant-numeric:tabular-nums}
.in-log span{color:var(--ink-3);margin-right:8px}
.in-st{font-size:14px;color:var(--ink-2);margin:0}
.in-st b{color:var(--ink)}
#inTarget{width:96px;text-align:center}
.wo-panel{grid-column:1/-1}
.wog{width:100%;height:120px;display:block}
.wog-ftp{stroke:var(--ink-3);stroke-width:1;stroke-dasharray:4 4;vector-effect:non-scaling-stroke}
.wog-now{stroke:var(--ink);stroke-width:2;vector-effect:non-scaling-stroke}
.wo-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px}
.wo-card{appearance:none;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:10px;display:flex;flex-direction:column;gap:6px;cursor:pointer}
.wo-card[aria-pressed="true"]{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink)}
.wo-card .wog{height:48px}
.wo-card b{font:700 16px var(--f-disp)}
.wo-card span{font-size:12.5px;color:var(--ink-2)}
.wo-steps{margin:0;padding-left:18px;font-size:13.5px;color:var(--ink-2);font-variant-numeric:tabular-nums}
textarea.dt-in{width:100%;min-height:70px;resize:vertical;font-family:ui-monospace,monospace;font-size:13.5px}
.err{color:var(--crit);font-size:13.5px;margin:0}
.ride{grid-column:1/-1}
.ride .wog{height:160px}
.rd-big{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.rd-b{background:var(--surface-2);border-radius:var(--r);padding:10px 12px;display:flex;flex-direction:column;min-width:0}
.rd-b span{font-size:12.5px;color:var(--ink-2)}
.rd-b b{font:700 52px/1 var(--f-disp);font-variant-numeric:tabular-nums}
.rd-b small{font:600 16px var(--f-disp);color:var(--ink-2);margin-left:3px}
.rd-sub{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:14px;color:var(--ink-2)}
.rd-sub b{color:var(--ink);font-variant-numeric:tabular-nums}
.rd-trace{fill:none;stroke:var(--ink);stroke-width:1.5;vector-effect:non-scaling-stroke;opacity:.85}
@media (max-width:520px){.rd-b b{font-size:34px}}
.note a{color:var(--ink)}
/* Szene: Wüste mit Leopardgecko (feste Illustrationsfarben) */
.scene{position:relative;height:230px;border-radius:var(--r);overflow:hidden;border:1px solid var(--line);flex:none}
@media (max-width:520px){.scene{height:160px}}
.scene svg{display:block;width:100%;height:100%}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .scene svg{filter:brightness(.9)}}
:root[data-theme="dark"] .scene svg{filter:brightness(.9)}
.scene .o{stroke:#2b1d14;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}
.scene .o2{stroke:#2b1d14;stroke-width:2.2;stroke-linejoin:round;stroke-linecap:round}
#scVeil{transition:opacity 1.5s ease;pointer-events:none}
.bubble{position:absolute;right:12%;top:8%;max-width:220px;background:#fff;color:#2b1d14;border:2px solid #2b1d14;border-radius:16px;padding:6px 12px;font:700 18px/1.2 var(--f-disp);text-align:center;opacity:0;visibility:hidden;transform:scale(.5);transform-origin:85% 100%;transition:opacity .18s,transform .18s,visibility 0s .18s;pointer-events:none;z-index:2}
.bubble.on{opacity:1;visibility:visible;transform:none;transition:opacity .18s,transform .18s;animation:sc-pop .28s cubic-bezier(.3,1.5,.5,1)}
.bubble::after{content:"";position:absolute;bottom:-9px;right:clamp(22px,var(--tail,40px),calc(100% - 38px));width:14px;height:14px;background:#fff;border-right:2px solid #2b1d14;border-bottom:2px solid #2b1d14;transform:rotate(45deg)}
@keyframes sc-pop{0%{opacity:0;transform:scale(.4)}100%{opacity:1;transform:scale(1)}}
.sc-set{gap:8px}
.sc-set .btn{padding:5px 10px;font-size:13px}
.sc-set .btn[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
/* Gecko: Dauerbewegung */
.scene .gk{transform-origin:100px 131px}
.gk-tail{transform-origin:150px 104px;animation:gk-tail 3s ease-in-out infinite}
@keyframes gk-tail{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}
.gk-body{transform-origin:100px 126px;animation:gk-breathe 2.5s ease-in-out infinite}
@keyframes gk-breathe{0%,100%{transform:scaleY(1)}50%{transform:scaleY(1.02)}}
.gk-head{transform-origin:62px 92px;transition:transform .6s ease}
.gk-arm{transform-origin:34px 102px}
.gk-eye{transform-box:fill-box;transform-origin:center}
.gk-lids>*{transform-box:fill-box;transform-origin:50% 0;transform:scaleY(0)}
.gk-tongue{transform-origin:24px 80px;opacity:0;transform:scaleX(0)}
.gk-cricket{opacity:0;transform:translate(-110px,124px)}
.gk-band{opacity:0}
.gk-thumb{opacity:0}
.gk-watch{transform-box:fill-box;transform-origin:center}
.gk-zzz text{opacity:0;font:900 16px Arial,Helvetica,sans-serif;fill:#fff;stroke:#2b1d14;stroke-width:3;paint-order:stroke;stroke-linejoin:round}
/* Einmal-Posen */
.gk.blink .gk-lids>*{animation:gk-blink .15s ease-in-out}
@keyframes gk-blink{0%,100%{transform:scaleY(0)}50%{transform:scaleY(1)}}
.gk.wave .gk-arm{animation:gk-wave 1.6s ease-in-out}
@keyframes gk-wave{0%,100%{transform:rotate(0)}12%{transform:rotate(100deg)}24%{transform:rotate(124deg)}36%{transform:rotate(92deg)}48%{transform:rotate(124deg)}60%{transform:rotate(92deg)}72%{transform:rotate(124deg)}86%{transform:rotate(100deg)}}
.gk.thumbs .gk-arm{animation:gk-thumbs 2s ease-in-out}
@keyframes gk-thumbs{0%,100%{transform:rotate(0)}16%{transform:rotate(104deg)}28%{transform:rotate(98deg)}40%{transform:rotate(106deg)}52%{transform:rotate(98deg)}84%{transform:rotate(102deg)}}
.gk.thumbs .gk-thumb{animation:gk-thumb 2s}
@keyframes gk-thumb{0%,10%{opacity:0}16%,84%{opacity:1}92%,100%{opacity:0}}
.gk.thumbs .gk-toes,.gk.cheer .gk-toes{animation:gk-toes 2s}
.gk.cheer .gk-toes{animation:none;opacity:0}
@keyframes gk-toes{0%,10%{opacity:1}16%,84%{opacity:0}92%,100%{opacity:1}}
.gk.jump{animation:gk-jump 1.2s ease-in-out}
@keyframes gk-jump{0%,46%,100%{transform:none}8%,54%{transform:scale(1.08,.9)}22%,70%{transform:translateY(-30px) scale(.96,1.05)}38%,88%{transform:scale(1.1,.88)}}
.gk.wow .gk-eye{animation:gk-wow-eye 1.5s ease-in-out}
@keyframes gk-wow-eye{0%,100%{transform:scale(1)}15%,70%{transform:scale(1.15)}}
.gk.wow .gk-head{animation:gk-wow-head 1.5s ease-in-out}
@keyframes gk-wow-head{0%,100%{transform:none}15%,70%{transform:rotate(7deg) translate(2px,-2px)}}
.gk.tap .gk-arm{animation:gk-tap 1.8s ease-in-out}
@keyframes gk-tap{0%,100%{transform:rotate(0)}16%{transform:rotate(100deg)}26%{transform:rotate(90deg)}32%{transform:rotate(100deg)}42%{transform:rotate(90deg)}48%{transform:rotate(100deg)}58%{transform:rotate(90deg)}64%{transform:rotate(100deg)}86%{transform:rotate(100deg)}}
.gk.tap .gk-watch{animation:gk-wpulse 1.8s ease-in-out}
@keyframes gk-wpulse{0%,16%,100%{transform:scale(1)}26%,42%,58%{transform:scale(1.45)}32%,48%,64%{transform:scale(1.1)}}
.gk.lick .gk-tongue{animation:gk-lick 1.2s ease-in-out}
@keyframes gk-lick{0%{opacity:0;transform:rotate(120deg) scaleX(0)}10%{opacity:1;transform:rotate(120deg) scaleX(.25)}25%{opacity:1;transform:rotate(112deg) scaleX(1)}40%{opacity:1;transform:rotate(130deg) scaleX(1)}55%{opacity:1;transform:rotate(112deg) scaleX(1)}70%{opacity:1;transform:rotate(130deg) scaleX(1)}85%{opacity:1;transform:rotate(120deg) scaleX(.5)}100%{opacity:0;transform:rotate(120deg) scaleX(0)}}
.gk.eat .gk-cricket{animation:gk-cricket 2.5s linear}
@keyframes gk-cricket{
0%{opacity:0;transform:translate(-112px,124px)}
4%{opacity:1;transform:translate(-110px,124px)}
10%{transform:translate(-100px,111px)}
16%{transform:translate(-88px,124px)}
22%{transform:translate(-88px,124px)}
28%{transform:translate(-76px,109px)}
34%{transform:translate(-62px,124px)}
40%{transform:translate(-62px,124px)}
46%{transform:translate(-50px,108px)}
52%{transform:translate(-38px,124px)}
56%{transform:translate(-38px,124px)}
60%{transform:translate(-18px,92px)}
64%{opacity:1;transform:translate(-4px,82px) scale(1)}
68%{opacity:1;transform:translate(-4px,82px) scale(1)}
74%{opacity:1;transform:translate(22px,82px) scale(.5)}
76%,100%{opacity:0;transform:translate(26px,82px) scale(.1)}}
.gk.eat .gk-tongue{animation:gk-eat-tongue 2.5s ease-in-out}
@keyframes gk-eat-tongue{0%,60%{opacity:0;transform:scaleX(0)}62%{opacity:1;transform:scaleX(.2)}66%{opacity:1;transform:scaleX(1)}70%{opacity:1;transform:scaleX(1)}76%{opacity:1;transform:scaleX(.1)}78%,100%{opacity:0;transform:scaleX(0)}}
.gk.eat .gk-head{animation:gk-chew 2.5s ease-in-out}
@keyframes gk-chew{0%,78%{transform:none}82%,90%,98%{transform:translateY(3px)}86%,94%{transform:none}100%{transform:none}}
/* Dauerzustände */
.gk.sleep .gk-lids>*{transform:scaleY(1)}
.gk.sleep .gk-head{transform:rotate(-6deg) translateY(4px)}
.gk.sleep .gk-zzz text{animation:gk-z 3s ease-out infinite}
.gk.sleep .gk-zzz text:nth-child(2){animation-delay:1s}
.gk.sleep .gk-zzz text:nth-child(3){animation-delay:2s}
@keyframes gk-z{0%{opacity:0;transform:translate(0,6px)}20%,70%{opacity:1}100%{opacity:0;transform:translate(10px,-24px)}}
.gk.band .gk-band{opacity:1}
.gk-bt{transform-origin:88px 48px}
.gk.band .gk-bt{animation:gk-flutter .5s ease-in-out infinite alternate}
.gk.band .gk-bt2{animation-delay:-.25s;animation-duration:.42s}
@keyframes gk-flutter{0%{transform:rotate(-12deg)}100%{transform:rotate(12deg)}}
.gk.cheer{animation:gk-cheer .9s ease-in-out infinite}
@keyframes gk-cheer{0%,100%{transform:scale(1.06,.94)}40%{transform:translateY(-26px) scale(.96,1.05)}}
.gk.cheer .gk-arm{animation:gk-armup .45s ease-in-out infinite alternate}
@keyframes gk-armup{0%{transform:rotate(116deg)}100%{transform:rotate(138deg)}}
.confetti{display:none}
.scene.cheering .confetti{display:inline}
.cf{transform-box:fill-box;transform-origin:center;animation:cf-fall 3.6s linear infinite}
@keyframes cf-fall{0%{transform:translate(0,-20px) rotate(0)}100%{transform:translate(var(--dx,0px),340px) rotate(720deg)}}
@media (prefers-reduced-motion:reduce){
  .scene *,.scene *::after{animation:none!important;transition:none!important}
  .confetti{display:none!important}
  .gk.sleep .gk-zzz text{opacity:1}
}
</style>
</head>
<body>
<header class="top"><div class="top-in"><span class="mark">SUB<b>9</b></span><span class="brand-sub">Indoor</span></div></header>
<main class="app"><section class="view" id="view-indoor" aria-label="Indoor-Trainer"></section></main>
<script>
(function(){
'use strict';
function $(s){return document.querySelector(s)}
function h(v){return String(v==null?'':v).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
var nf1=new Intl.NumberFormat('de-DE',{minimumFractionDigits:1,maximumFractionDigits:1});
var S={view:'indoor'};
/* Wie in Sub9: ein Eingabefeld mit Fokus wird nicht überschrieben, gerendert wird nach dem Verlassen */
var deferred=false;
var DEFER_IDS=['inTarget','woFtp','woText'];
function render(){
  var ae=document.activeElement;
  if(ae&&DEFER_IDS.indexOf(ae.id)>=0){if(!deferred){deferred=true;ae.addEventListener('blur',function(){deferred=false;render()},{once:true})}return}
  renderIndoor();
}

/* ---------- Indoor-Trainer (Bluetooth) ---------- */
var BT_OK=!!(navigator.bluetooth&&navigator.bluetooth.requestDevice);
var IND={trainer:null,hr:null,live:{power:null,cadence:null,speed:null,hr:null},target:150,erg:false,ctrl:false,log:[],busy:''};
var cpQ=Promise.resolve();
var FTMS_OP={0:'Steuerung',1:'Reset',5:'Wattvorgabe'},FTMS_RES={1:'OK',2:'nicht unterstützt',3:'ungültiger Wert',4:'fehlgeschlagen',5:'Steuerung nicht erlaubt'};

/* Reine Parser: kein DOM-Zugriff, Eingabe ist ein DataView */
function parseBikeData(dv){
  var r={speed:null,cadence:null,power:null,hr:null};
  if(!dv||dv.byteLength<2)return r;
  var flags=dv.getUint16(0,true),o=2;
  function fits(n){return o+n<=dv.byteLength}
  if(!(flags&1)){if(!fits(2))return r;r.speed=dv.getUint16(o,true)/100;o+=2}
  if(flags&2){if(!fits(2))return r;o+=2}
  if(flags&4){if(!fits(2))return r;r.cadence=dv.getUint16(o,true)/2;o+=2}
  if(flags&8){if(!fits(2))return r;o+=2}
  if(flags&16){if(!fits(3))return r;o+=3}
  if(flags&32){if(!fits(2))return r;o+=2}
  if(flags&64){if(!fits(2))return r;r.power=dv.getInt16(o,true);o+=2}
  if(flags&128){if(!fits(2))return r;o+=2}
  if(flags&256){if(!fits(5))return r;o+=5}
  if(flags&512){if(!fits(1))return r;r.hr=dv.getUint8(o);o+=1}
  return r;
}
function parseHr(dv){
  if(!dv||dv.byteLength<2)return null;
  var f=dv.getUint8(0);
  if(f&1){if(dv.byteLength<3)return null;return dv.getUint16(1,true)}
  return dv.getUint8(1);
}
function ftmsTargetPowerCmd(w){return new Uint8Array([0x05,w&0xFF,(w>>8)&0xFF])}

function indFmt(v,d){return v==null?'–':(d?nf1.format(v):String(Math.round(v)))}
function indVals(){var L=IND.live;return {inPow:indFmt(L.power),inCad:indFmt(L.cadence),inSpd:indFmt(L.speed,1),inHr:indFmt(L.hr)}}
/* Live-Werte: nur die Zahlen aktualisieren, nicht neu rendern */
function indLive(){var v=indVals();Object.keys(v).forEach(function(id){var e=$('#'+id);if(e)e.textContent=v[id]})}
function indLog(msg){
  var d=new Date(),p=function(n){return (n<10?'0':'')+n};
  IND.log.unshift({t:p(d.getHours())+':'+p(d.getMinutes())+':'+p(d.getSeconds()),m:msg});
  if(IND.log.length>12)IND.log.length=12;
  if(S.view==='indoor')render();
}
function indEnd(){IND.busy='';render()}
function indFail(e,dev){
  var n=e&&e.name;
  if(n==='SecurityError'){IND.blocked=true;indLog('Bluetooth ist in dieser Ansicht blockiert (Browser-Sicherheitsregel)');return}
  if(n==='NotFoundError'&&!dev){indLog('Keine Auswahl getroffen');return}
  indLog('Fehler: '+((e&&e.message)||e));
}
function indGone(kind,dev){
  if(kind==='trainer'){
    if(IND.trainer&&IND.trainer.device!==dev)return;
    IND.trainer=null;IND.ctrl=false;IND.erg=false;IND.ergW=null;
    IND.ctrlReq=false;if(RIDE)RIDE.lastSent=null;
    IND.live.power=IND.live.cadence=IND.live.speed=null;
    indLog('Trainer getrennt');
  }else{
    if(IND.hr&&IND.hr.device!==dev)return;
    IND.hr=null;IND.live.hr=null;
    indLog('Pulsgurt getrennt');
  }
  render();
}
function indBike(dv){
  var v=parseBikeData(dv);
  IND.live.power=v.power;IND.live.cadence=v.cadence;IND.live.speed=v.speed;
  if(!IND.hr&&v.hr!=null)IND.live.hr=v.hr;
  indLive();
}
function indCpReply(dv){
  if(!dv||dv.byteLength<3||dv.getUint8(0)!==0x80)return;
  var op=dv.getUint8(1),r=dv.getUint8(2),rideOn=!!(RIDE&&!RIDE.done);
  if(op===0){IND.ctrlReq=false;if(r===1)IND.ctrl=true}

}

function indConnTrainer(){

  var dev=null,srv=null,sv=null;

    dev=d;dev.addEventListener('gattserverdisconnected',function(){indGone('trainer',dev)});
    return dev.gatt.connect();
  }).then(function(s){srv=s;return srv.getPrimaryService(0x1826)})
  .then(function(s){sv=s;return sv.getCharacteristic(0x2AD2)})
  .then(function(bike){
    bike.addEventListener('characteristicvaluechanged',function(e){indBike(e.target.value)});
    return bike.startNotifications().then(function(){return bike});
  }).then(function(bike){
    return sv.getCharacteristic(0x2AD9).then(function(cp){

    if(dev&&dev.gatt&&dev.gatt.connected){try{dev.gatt.disconnect()}catch(_){}}

}

function indErg(){

/* ---------- Workouts ---------- */
var WORKOUTS=[
 {id:'z2',name:'Grundlage 60 min',text:'10m 45-65%, 45m 68%, 5m 65-45%'},
 {id:'akt',name:'Aktivierung 45 min',text:'10m 50-65%, 3x(1m 100%, 4m 60%), 20m 65%'},
 {id:'sst',name:'Sweet Spot 3×12',text:'10m 45-70%, 3x(12m 90%, 4m 55%), 10m 50%'},
 {id:'thr',name:'Schwelle 2×20',text:'15m 45-75%, 2x(20m 97%, 5m 55%), 10m 50%'},
 {id:'vo2',name:'VO2max 5×4',text:'15m 45-75%, 5x(4m 115%, 4m 50%), 10m 50%'}
];
var WO={ftp:250,sel:null,text:'',err:''};

/* Reiner Parser: kein DOM. Elemente durch Komma oder Zeilenumbruch getrennt, Wiederholung Nx(...) */
function parseWorkout(text){
  var s=String(text==null?'':text),n=s.length,p=0,MAXT=28800;
  function fail(m){throw {woErr:m}}
  function sp(){while(p<n&&(s[p]===' '||s[p]==='\t'||s[p]==='\r'))p++}
  function rawAt(a){var b=a;while(b<n&&',\n)'.indexOf(s[b])<0)b++;return s.slice(a,b).trim()}
  function elem(out,inRep){
    var a=p,m,rx,k,inner,sum,i,dur,lo,hi,abs,lim;
    rx=/(\d+)[ \t]*[x×][ \t]*\(/y;rx.lastIndex=p;m=rx.exec(s);
    if(m){
      p=rx.lastIndex;k=parseInt(m[1],10);
      if(k<1||k>50)fail('Wert außerhalb des erlaubten Bereichs: "'+rawAt(a)+'"');
      inner=list(true);
      if(!inner.length)fail('Nicht verstanden: "'+s.slice(a,p).trim()+'"');
      sum=0;inner.forEach(function(st){sum+=st.dur});
      if(sum*k>MAXT)fail('Wert außerhalb des erlaubten Bereichs: "Gesamtdauer über 8 h"');
      for(i=0;i<k;i++)inner.forEach(function(st){out.push({dur:st.dur,lo:st.lo,hi:st.hi,abs:st.abs})});
      return;
    }
    rx=/(?:(\d+)h)?(?:(\d+)m)?(?:(\d+)s)?/y;rx.lastIndex=p;m=rx.exec(s);
    if(!m||!m[0])fail('Nicht verstanden: "'+rawAt(a)+'"');
    p+=m[0].length;
    dur=(+m[1]||0)*3600+(+m[2]||0)*60+(+m[3]||0);
    sp();
    rx=/(\d+)(?:-(\d+))?(%|[Ww])/y;rx.lastIndex=p;m=rx.exec(s);
    if(!m)fail('Nicht verstanden: "'+rawAt(a)+'"');
    p=rx.lastIndex;
    abs=m[3]!=='%';lo=+m[1];hi=m[2]!==undefined?+m[2]:lo;lim=abs?2000:300;
    if(dur<1||dur>21600||lo>lim||hi>lim)fail('Wert außerhalb des erlaubten Bereichs: "'+rawAt(a)+'"');
    out.push(abs?{dur:dur,lo:lo,hi:hi,abs:true}:{dur:dur,lo:lo/100,hi:hi/100,abs:false});
  }
  function list(inRep){
    var out=[],a,c;
    for(;;){
      sp();
      if(p>=n){if(inRep)fail('Klammer fehlt');return out}
      c=s[p];
      if(c===','||c==='\n'){p++;continue}
      if(c===')'){if(inRep){p++;return out}fail('Nicht verstanden: ")"')}
      a=p;
      elem(out,inRep);
      sp();
      if(p<n&&s[p]!==','&&s[p]!=='\n'&&!(inRep&&s[p]===')'))fail('Nicht verstanden: "'+rawAt(a)+'"');
    }
  }
  try{
    var steps=list(false),total=0;
    steps.forEach(function(st){total+=st.dur});
    if(!steps.length)fail('Kein Workout eingegeben');
    if(total>MAXT)fail('Wert außerhalb des erlaubten Bereichs: "Gesamtdauer über 8 h"');
    return {steps:steps,total:total,error:null};
  }catch(e){
    if(e&&e.woErr)return {steps:[],total:0,error:e.woErr};
    throw e;
  }
}

/* ---------- Workout-Hilfsfunktionen ---------- */
function woWatts(st,ftp,frac){var v=st.lo+(st.hi-st.lo)*frac;if(!st.abs)v=v*ftp;return Math.round(v)}
function zoneOf(f){
  if(f<0.56)return {k:'Z1',l:'Erholung',c:'--z1'};
  if(f<0.76)return {k:'Z2',l:'Grundlage',c:'--z2'};
  if(f<0.88)return {k:'Z3',l:'Tempo',c:'--z3'};
  if(f<0.95)return {k:'SST',l:'Sweet Spot',c:'--z4'};
  if(f<1.06)return {k:'Z4',l:'Schwelle',c:'--z5'};
  if(f<1.21)return {k:'Z5',l:'VO2max',c:'--z6'};
  return {k:'Z6',l:'Anaerob',c:'--z7'};
}
function stepFrac(st,ftp){return ((st.lo+st.hi)/2)/(st.abs?ftp:1)}
function fmtClock(sec){
  var s=Math.max(0,Math.round(sec||0)),hh=Math.floor(s/3600),mm=Math.floor(s%3600/60),ss=s%60;
  var p2=function(x){return (x<10?'0':'')+x};
  return hh?hh+':'+p2(mm)+':'+p2(ss):mm+':'+p2(ss);
}
function woAvg(steps,ftp){var t=0,a=0;steps.forEach(function(st){t+=st.dur;a+=stepFrac(st,ftp)*st.dur});return t?Math.round(a/t*100):0}
function woPctTxt(st){
  if(st.abs)return st.lo===st.hi?Math.round(st.lo)+' W':Math.round(st.lo)+'–'+Math.round(st.hi)+' W';
  var a=Math.round(st.lo*100),b=Math.round(st.hi*100);
  return a===b?a+' %':a+'–'+b+' %';
}
function woWattTxt(st){
  var a=woWatts(st,WO.ftp,0),b=woWatts(st,WO.ftp,1);
  return a===b?a+' W':a+'–'+b+' W';
}

/* SVG-Profil: viewBox 0 0 1000 200, 0 W unten, oben max(1.3, hoechster Bruchteil)*FTP */
function woGraph(steps,total,ftp,opts){
  opts=opts||{};
  var top=woTop(steps,ftp),start=0,g='';
  function r(v){return Math.round(v*10)/10}
  function Y(w){return r(200-w/top*200)}
  function X(t){return total>0?r(t/total*1000):0}
  steps.forEach(function(st){
    var x0=X(start),x1=X(start+st.dur),y0=Y(woWatts(st,ftp,0)),y1=Y(woWatts(st,ftp,1));
    g+='<path d="M'+x0+' 200L'+x0+' '+y0+'L'+x1+' '+y1+'L'+x1+' 200Z" style="fill:var('+zoneOf(stepFrac(st,ftp)).c+')"/>';
    start+=st.dur;
  });
  g+='<line class="wog-ftp" x1="0" x2="1000" y1="'+Y(ftp)+'" y2="'+Y(ftp)+'"/>';
  if(opts.progress!=null){var nx=X(opts.progress);g+='<line class="wog-now" id="wogNow" x1="'+nx+'" x2="'+nx+'" y1="0" y2="200"/>'}
  if(opts.trace&&opts.trace.length)g+='<polyline id="rdTrace" class="rd-trace" points="'+woTracePts(steps,total,ftp,opts.trace)+'"/>';
  return '<svg viewBox="0 0 1000 200" class="wog" preserveAspectRatio="none" role="img" aria-label="Workout-Profil"'+(opts.id?' id="'+h(opts.id)+'"':'')+'>'+g+'</svg>';
}

/* ---------- Workout-Aktionen ---------- */
function woSaveFtp(){try{localStorage.setItem('sub9i.ftp',String(WO.ftp))}catch(e){}}
function woInit(){
  try{var f0=Number(localStorage.getItem('sub9i.ftp'));if(f0>=80&&f0<=600)WO.ftp=f0}catch(e){}
  var q=new URLSearchParams(location.hash.slice(1)),f=Math.round(Number(q.get('ftp')));
  if(q.get('ftp')!==null&&f>=80&&f<=600){WO.ftp=f;woSaveFtp()}
  var w=q.get('w');
  if(w!==null&&w.trim()!==''){
    var p=parseWorkout(w);WO.text=w;
    if(p.error)WO.err=p.error;
    else WO.sel={name:q.get('name')||'Workout aus Sub9',text:w,steps:p.steps,total:p.total};
  }
}
function woPick(id){
  var w=WORKOUTS.filter(function(x){return x.id===id})[0];if(!w)return;
  var p=parseWorkout(w.text);
  WO.sel={name:w.name,text:w.text,steps:p.steps,total:p.total};WO.err='';render();
}
function woCustom(){
  var ta=$('#woText'),text=ta?ta.value:WO.text,p=parseWorkout(text);
  WO.text=text;
  if(p.error)WO.err=p.error;
  else{WO.sel={name:'Eigenes Workout',text:text,steps:p.steps,total:p.total};WO.err=''}
  render();
}
function woInput(ev){
  var t=ev.target;if(!t)return;
  if(t.id==='woFtp'){var f=Math.round(Number(t.value));if(f>=80&&f<=600){WO.ftp=f;woSaveFtp()}}
  else if(t.id==='woText')WO.text=t.value;
}
function woTop(steps,ftp){var top=1.3*ftp;steps.forEach(function(st){top=Math.max(top,woWatts(st,ftp,0),woWatts(st,ftp,1))});return top}
function woTracePts(steps,total,ftp,trace){
  var top=woTop(steps,ftp),pts=[],k,stp=Math.ceil(trace.length/1000);
  for(k=0;k<trace.length;k+=stp){pts.push((total>0?Math.round(k/total*10000)/10:0)+','+Math.round((200-(trace[k]||0)/top*200)*10)/10)}
  return pts.join(' ');
}
/* ---------- Fahrt: reine Funktionen ---------- */
var RIDE=null;
function stepStarts(steps){var out=[],t=0;steps.forEach(function(st){out.push(t);t+=st.dur});return out}
function rideTargetAt(steps,ftp,el,bias){
  var starts=stepStarts(steps),total=0,i,st,frac,v;
  steps.forEach(function(s){total+=s.dur});
  if(el<0)el=0;
  if(el>=total)return {i:-1,w:0,remain:0};
  for(i=0;i<steps.length;i++){if(starts[i]<=el&&el<starts[i]+steps[i].dur)break}
  st=steps[i];frac=(el-starts[i])/st.dur;
  v=st.lo+(st.hi-st.lo)*frac;if(!st.abs)v=v*ftp;
  v=Math.round(v*bias);
  return {i:i,w:Math.min(2000,Math.max(0,v)),remain:starts[i]+st.dur-el};
}
function rideStats(samples,ftp){
  var n=samples.length,out={dur:n,avg:0,np:0,if:0,tss:0,kj:0,avgHr:null,maxHr:null,avgCad:null,dist:0};
  if(!n)return out;
  var ps=samples.map(function(s){return s.p||0}),sum=0,i,j,ws,q=0,cnt=0,npRaw,ifRaw,hrs=[],cads=[],d=0,hrSum=0,cSum=0;
  ps.forEach(function(p){sum+=p});
  var mean=sum/n;out.avg=Math.round(mean);npRaw=mean;
  if(n>=30){
    for(i=29;i<n;i++){ws=0;for(j=i-29;j<=i;j++)ws+=ps[j];q+=Math.pow(ws/30,4);cnt++}
    npRaw=Math.pow(q/cnt,0.25);
  }
  out.np=Math.round(npRaw);
  ifRaw=npRaw/ftp;out.if=Math.round(ifRaw*100)/100;
  out.tss=Math.round(n*npRaw*ifRaw/(ftp*3600)*100);
  out.kj=Math.round(sum/1000);
  samples.forEach(function(s){
    if(s.hr!=null){hrs.push(s.hr);hrSum+=s.hr;if(out.maxHr==null||s.hr>out.maxHr)out.maxHr=s.hr}
    if(s.c!=null&&s.c>0){cads.push(s.c);cSum+=s.c}
    d+=(s.s||0)/3.6;
  });
  if(hrs.length)out.avgHr=Math.round(hrSum/hrs.length);
  if(cads.length)out.avgCad=Math.round(cSum/cads.length);
  out.dist=Math.round(d);
  return out;
}

/* ---------- Fahrt: Steuerung ---------- */
function rideRound(v){return v==null?null:Math.round(v)}
function ridePow(){
  var ps=RIDE.samples.slice(-3).map(function(s){return s.p}).filter(function(v){return v!=null});
  if(ps.length)return String(Math.round(ps.reduce(function(a,b){return a+b},0)/ps.length));
  return indFmt(IND.live.power);
}
function rideStart(){
  if(!WO.sel||(RIDE&&!RIDE.done))return;
  RIDE={name:WO.sel.name,text:WO.sel.text,steps:WO.sel.steps,total:WO.sel.total,ftp:WO.ftp,bias:1,el:0,run:false,done:false,startTs:null,lastTick:null,samples:[],lastSent:null,i:0,timer:null};
  RIDE.timer=setInterval(rideTick,1000);
  rideToggle();
  SAVED=null;
  rideSave();
  rideWake();
  sceneStart();
  render();window.scrollTo(0,0);
}
function rideToggle(){
  if(!RIDE||RIDE.done)return;
  var first=RIDE.startTs==null;
  RIDE.run=!RIDE.run;
  if(RIDE.run){RIDE.lastTick=Date.now();if(first)RIDE.startTs=Math.floor(Date.now()/1000)}
  indLog(RIDE.run?(first?'Fahrt gestartet':'Weiter'):'Pause');
  sceneToggle(first);
  render();
}
function rideSend(w){
  if(!IND.ctrl&&!IND.ctrlReq){IND.ctrlReq=true;indWrite(new Uint8Array([0x00]))}
  indWrite(ftmsTargetPowerCmd(w));
  if(RIDE)RIDE.lastSent=w;
  IND.erg=true;IND.ergW=w;
}
function rideTick(){
  if(!RIDE||RIDE.done)return;
  var now=Date.now(),R=RIDE,tg;
  if(R.run){R.el+=Math.min(5,(now-R.lastTick)/1000);R.lastTick=now}
  tg=rideTargetAt(R.steps,R.ftp,R.el,R.bias);
  if(tg.i===-1){rideFinish();return}
  if(R.run)R.samples.push({ts:Math.floor(now/1000),p:rideRound(IND.live.power),c:rideRound(IND.live.cadence),hr:rideRound(IND.live.hr),s:IND.live.speed==null?null:Math.round(IND.live.speed*10)/10,t:tg.w});
  if(R.run&&R.samples.length%15===0)rideSave();
  if(tg.i!==R.i){R.i=tg.i;render()}
  if(R.run&&IND.trainer&&IND.trainer.cp&&tg.w!==R.lastSent)rideSend(tg.w);
  rideLive();
  sceneTick();
}
function rideBias(d){
  if(!RIDE||RIDE.done)return;
  RIDE.bias=Math.min(1.5,Math.max(0.5,Math.round((RIDE.bias+d)*100)/100));
  if(RIDE.run&&IND.trainer&&IND.trainer.cp)rideSend(rideTargetAt(RIDE.steps,RIDE.ftp,RIDE.el,RIDE.bias).w);
  render();
}
function rideSkip(){
  if(!RIDE||RIDE.done)return;
  var cur=rideTargetAt(RIDE.steps,RIDE.ftp,RIDE.el,RIDE.bias).i,starts=stepStarts(RIDE.steps);
  if(cur+1>=RIDE.steps.length){rideFinish();return}
  RIDE.el=starts[cur+1];
  render();
}
function rideFinish(){
  if(!RIDE||RIDE.done)return;
  RIDE.run=false;RIDE.done=true;clearInterval(RIDE.timer);
  rideSave();
  RIDE.lock&&RIDE.lock.release().catch(function(){});
  if(IND.trainer&&IND.trainer.cp){indWrite(new Uint8Array([0x01]));IND.erg=false;IND.ctrl=false;IND.ctrlReq=false;IND.ergW=null}
  sceneFinish();
  indLog('Fahrt beendet');
  render();window.scrollTo(0,0);
}
function rideStop(){if(!confirm('Fahrt beenden?'))return;rideFinish()}
function rideClose(){rideDropKey();RIDE=null;sceneClose();render()}
function rideLive(){
  if(!RIDE||RIDE.done)return;
  var R=RIDE,cur=rideTargetAt(R.steps,R.ftp,R.el,R.bias);
  function set(id,t){var e=$('#'+id);if(e)e.textContent=String(t)}
  set('rdEl',fmtClock(R.el));set('rdTgt',cur.w);set('rdPow',ridePow());set('rdRem',fmtClock(cur.remain));
  set('rdCad',indFmt(IND.live.cadence));set('rdHr',indFmt(IND.live.hr));
  var line=$('#wogNow'),x=R.total>0?Math.round(R.el/R.total*10000)/10:0;
  if(line){line.setAttribute('x1',x);line.setAttribute('x2',x)}
  var tr=$('#rdTrace');
  if(tr)tr.setAttribute('points',woTracePts(R.steps,R.total,R.ftp,R.samples.map(function(s){return s.p})));
  indLive();
}
document.addEventListener('keydown',function(ev){
  if(!RIDE||RIDE.done)return;
  var tg=ev.target&&ev.target.tagName;
  if(tg==='INPUT'||tg==='TEXTAREA')return;
  if(ev.key===' '||ev.code==='Space'){
    if(ev.repeat||tg==='BUTTON')return;
    ev.preventDefault();rideToggle();
  }
  else if(ev.key==='ArrowUp'){ev.preventDefault();rideBias(0.05)}
  else if(ev.key==='ArrowDown'){ev.preventDefault();rideBias(-0.05)}
});

/* ---------- Fahrt: FIT-Export (reine Funktionen) ---------- */

var FIT_E=0x00,FIT_U8=0x02,FIT_U16=0x84,FIT_U32=0x86,FIT_U32Z=0x8C;

function fitTs(unix){return unix-631065600}
function fitCrc(bytes,crc0){
  var T=[0x0000,0xCC01,0xD801,0x1400,0xF001,0x3C00,0x2800,0xE401,0xA001,0x6C00,0x7800,0xB401,0x5000,0x9C01,0x8801,0x4400],crc=crc0||0,i,b,t;
  for(i=0;i<bytes.length;i++){
    b=bytes[i];
    t=T[crc&0xF];crc=(crc>>4)&0x0FFF;crc=crc^t^T[b&0xF];
    t=T[crc&0xF];crc=(crc>>4)&0x0FFF;crc=crc^t^T[(b>>4)&0xF];

function fitInvalid(bt){return bt===FIT_U16?0xFFFF:bt===FIT_U32?0xFFFFFFFF:bt===FIT_U32Z?0:0xFF}

function fitDef(out,local,gnum,fields){
  out.push(0x40|local,0,0,gnum&0xFF,(gnum>>8)&0xFF,fields.length);

}
function fitRec(out,local,fields,vals){
  out.push(local);

    else{v=Math.round(v);if(v<0)v=0;if(inv>0&&v>=inv)v=inv-1}
    fitWriteVal(out,v,f[1]);

/* FIT-Datei: Header (14 Byte), Datensaetze, End-CRC. Leere Samples -> null */
function fitEncode(samples,stats,startTs){
  if(!samples||!samples.length)return null;
  if(startTs==null)startTs=samples[0].ts;
  var last=samples[samples.length-1].ts,body=[],cum=0,i,s,header,hc,all,ec,ds;
  fitDef(body,0,0,F_FILE);
  fitRec(body,0,F_FILE,{0:4,1:255,2:1,3:1,4:fitTs(startTs)});
  fitDef(body,1,21,F_EVENT);
  fitRec(body,1,F_EVENT,{253:fitTs(startTs),0:0,1:0});
  fitDef(body,2,20,F_REC);
  for(i=0;i<samples.length;i++){
    s=samples[i];cum+=(s.s||0)/3.6;
    fitRec(body,2,F_REC,{253:fitTs(s.ts),3:s.hr,4:s.c,7:s.p,6:s.s==null?null:Math.round(s.s/3.6*1000),5:Math.round(cum*100)});
  }
  fitRec(body,1,F_EVENT,{253:fitTs(last),0:0,1:4});
  fitDef(body,3,19,F_LAP);
  fitRec(body,3,F_LAP,{253:fitTs(last),2:fitTs(startTs),7:(last-startTs+1)*1000,8:stats.dur*1000,9:stats.dist*100,11:stats.kj,15:stats.avgHr,16:stats.maxHr,17:stats.avgCad,19:stats.avg,0:9,1:1,25:2,39:6});
  fitDef(body,4,18,F_SESSION);
  fitRec(body,4,F_SESSION,{253:fitTs(last),2:fitTs(startTs),7:(last-startTs+1)*1000,8:stats.dur*1000,9:stats.dist*100,11:stats.kj,16:stats.avgHr,17:stats.maxHr,18:stats.avgCad,20:stats.avg,34:stats.np,35:Math.round(stats.tss*10),36:Math.round(stats.if*1000),25:0,26:1,0:8,1:1,5:2,6:6});
  fitDef(body,5,34,F_ACT);
  fitRec(body,5,F_ACT,{253:fitTs(last),0:stats.dur*1000,1:1,2:0,3:26,4:1,5:fitTs(last)-new Date(last*1000).getTimezoneOffset()*60});
  ds=body.length;
  header=[14,0x20,0x54,0x08,ds&0xFF,(ds>>8)&0xFF,(ds>>16)&0xFF,(ds>>24)&0xFF,0x2E,0x46,0x49,0x54];
  hc=fitCrc(header);
  header.push(hc&0xFF,(hc>>8)&0xFF);
  all=header.concat(body);
  ec=fitCrc(all);
  all.push(ec&0xFF,(ec>>8)&0xFF);
  return new Uint8Array(all);
}

function fitDownload(samples,ftp,startTs){
  var bytes=fitEncode(samples,rideStats(samples,ftp),startTs);
  if(!bytes){indLog('Keine Daten für den Export');return}
  var url=URL.createObjectURL(new Blob([bytes],{type:'application/octet-stream'})),
    d=new Date((startTs==null?samples[0].ts:startTs)*1000),p2=function(x){return (x<10?'0':'')+x},
    a=document.createElement('a');
  a.href=url;
  a.download='sub9-indoor-'+d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate())+'-'+p2(d.getHours())+p2(d.getMinutes())+'.fit';
  document.body.appendChild(a);a.click();a.remove();
  setTimeout(function(){URL.revokeObjectURL(url)},1000);
  indLog('FIT-Datei gespeichert');
}

/* ----- Szene-Element (entsteht einmal) ----- */
function sceneEl(){
  if(SCENE.el)return SCENE.el;
  var d=document.createElement('div');
  d.className='scene';d.setAttribute('aria-hidden','true');
  d.innerHTML=sceneSvg()+'<div class="bubble"></div>';
  SCENE.el=d;
  var q=function(s){return d.querySelector(s)};
  SCENE.refs={stop0:q('#scS0'),stop1:q('#scS1'),sun:q('#scSun'),stars:q('#scStars'),mesa:q('#scMesa'),dune:q('#scDune'),
    ground:q('#scGround'),tw:q('#scTw'),rock:q('#scRock'),veil:q('#scVeil'),gk:q('.gk'),bub:q('.bubble')};
  scState('band',SCENE.band);scState('sleep',SCENE.sleep);scState('cheer',SCENE.cheer);
  scApplyVeil();
  return d;
}
function sceneMode(){
  if(RIDE)return RIDE.done?'sum':'ride';
  return 'demo';
}
function sceneMount(){
  var slot=$('#sceneSlot');
  if(!slot){sceneStop();return}
  var el=sceneEl();
  slot.replaceWith(el);
  sceneSetMode(sceneMode());
  SCENE.fit='';
  sceneFit();
  sceneRun();
}
function sceneStop(){if(SCENE.raf){cancelAnimationFrame(SCENE.raf);SCENE.raf=0}}
function sceneRun(){
  if(SCENE.raf||document.hidden||!SCENE.el||!SCENE.el.isConnected)return;
  SCENE.last=0;
  SCENE.raf=requestAnimationFrame(sceneFrame);
}
document.addEventListener('visibilitychange',function(){if(!document.hidden)sceneRun()});
function sceneSetMode(m){
  if(SCENE.mode===m)return;
  SCENE.mode=m;
  scState('band',false);scState('sleep',false);scState('cheer',false);
  gkClearOnce();gkHide();
  SCENE.veil=0;scApplyVeil();
  if(m==='demo'){SCENE.t0=Date.now();SCENE.dn=-1}
  else if(m==='sum'){scState('cheer',true);geckoSay('Geschafft! 🎉')}
}
function scState(k,on){
  SCENE[k]=!!on;
  if(!SCENE.refs)return;
  SCENE.refs.gk.classList.toggle(k,!!on);
  if(k==='cheer')SCENE.el.classList.toggle('cheering',!!on);
}
function scApplyVeil(){if(SCENE.refs)SCENE.refs.veil.style.opacity=String(SCENE.veil)}
/* Sichtbarer Ausschnitt (slice): Gecko-Fels bleibt komplett im Bild, Blasenzipfel zeigt auf den Kopf */
function sceneFit(){
  var el=SCENE.el,w=el.clientWidth,h=el.clientHeight;
  if(!w||!h)return;
  var key=w+'x'+h;if(key===SCENE.fit)return;SCENE.fit=key;
  var sc=Math.max(w/1000,h/300),vw=w/sc,L=500-vw/2,Rr=500+vw/2;
  SCENE.vis={l:L,r:Rr,top:300-h/sc};
  var dx=Math.min(0,Rr-24-982);
  SCENE.refs.rock.setAttribute('transform','translate('+Math.round(dx)+' 0)');
  el.style.setProperty('--tail',Math.round(w*0.88-(786+dx-L)*sc)+'px');
}
function scSkyAt(f){
  var K=SC_SKY,i=1;
  while(i<K.length-1&&f>K[i][0])i++;
  var a=K[i-1],b=K[i],t=(f-a[0])/(b[0]-a[0]);t=Math.max(0,Math.min(1,t));
  function mix(c1,c2){
    var o='#',j,x,y,v;
    for(j=1;j<7;j+=2){x=parseInt(c1.substr(j,2),16);y=parseInt(c2.substr(j,2),16);v=Math.round(x+(y-x)*t);o+=(v<16?'0':'')+v.toString(16)}
    return o;
  }
  return [mix(a[1],b[1]),mix(a[2],b[2])];
}
function sceneF(){
  if(SCENE.mode==='demo')return ((Date.now()-SCENE.t0)%40000)/40000;
  if(RIDE&&RIDE.total>0)return Math.max(0,Math.min(1,RIDE.el/RIDE.total));
  return 0;
}
function sceneFrame(ts){
  SCENE.raf=0;
  var el=SCENE.el;
  if(!el||!el.isConnected||document.hidden)return;
  SCENE.raf=requestAnimationFrame(sceneFrame);
  if(SCENE.last&&ts-SCENE.last<30)return;
  var dt=SCENE.last?Math.min(0.1,(ts-SCENE.last)/1000):0.033;
  SCENE.last=ts;
  sceneStep(dt);
}
function sceneStep(dt){
  var R=SCENE.refs,L=IND.live,m=SCENE.mode,tv=0,kmh,now=Date.now(),f,sk,vis,xl,xr,amp,x,y,t;
  sceneFit();
  if(m==='ride'&&RIDE&&!RIDE.done&&RIDE.run){
    kmh=L.speed!=null?L.speed:(L.power>0?30*Math.cbrt(L.power/200):0);
    tv=kmh*6;
  }else if(m==='demo')tv=120;
  if(RM.matches)SCENE.v=0;
  else{SCENE.v+=(tv-SCENE.v)*0.05;SCENE.off+=SCENE.v*dt}
  var off=SCENE.off;
  R.mesa.setAttribute('transform','translate(-'+((off*0.08)%1000).toFixed(1)+' 0)');
  R.dune.setAttribute('transform','translate(-'+((off*0.3)%1000).toFixed(1)+' 0)');
  R.ground.setAttribute('transform','translate(-'+(off%1000).toFixed(1)+' 0)');
  /* Steppenläufer: rollt etwas schneller als der Boden */
  x=1500-((off*1.4+900)%2500);
  y=262-Math.abs(Math.sin(off*0.035))*6;
  R.tw.setAttribute('transform','translate('+x.toFixed(1)+' '+y.toFixed(1)+') rotate('+(-(off*0.4/17*57.3)%360).toFixed(1)+')');
  /* Tageszeit */
  f=sceneF();
  sk=scSkyAt(f);
  if(sk.join()!==SCENE.sky){SCENE.sky=sk.join();R.stop0.setAttribute('stop-color',sk[0]);R.stop1.setAttribute('stop-color',sk[1])}
  vis=SCENE.vis||{l:0,r:1000,top:0};
  xl=Math.max(0,vis.l)+80;xr=Math.min(1000,vis.r)-80;
  amp=Math.min(190,230-(Math.max(0,vis.top)+44));
  x=xl+f*(xr-xl);y=230-Math.sin(f*Math.PI)*amp;
  R.sun.setAttribute('transform','translate('+x.toFixed(1)+' '+y.toFixed(1)+')');
  R.stars.setAttribute('opacity',f>0.95?Math.min(0.8,(f-0.95)/0.05*0.8).toFixed(2):'0');
  /* Blinzeln */
  if(now>=SCENE.nextBlink){SCENE.nextBlink=now+scRnd(3000,6000);if(!SCENE.sleep)gkBlink()}
  if(m==='demo'){
    t=Math.floor((now-SCENE.t0)/4000);
    if(t!==SCENE.dn){SCENE.dn=t;sceneDemoStep(((t%8)+8)%8)}
  }
}
function sceneDemoStep(n){
  scState('band',n===6);scState('sleep',n===7);
  SCENE.veil=n===6?0.18:0;scApplyVeil();
  if(n===0){geckoDo('wave');geckoSay('Hallo!')}
  else if(n===1){geckoDo('thumbs');geckoSay('Stark!')}
  else if(n===2){geckoDo('jump');geckoSay('Wow!')}
  else if(n===3){geckoDo('tap');geckoSay('Schneller treten!')}
  else if(n===4)geckoDo('lick');
  else if(n===5)geckoDo('eat');
  else if(n===6){geckoSay("Jetzt gilt's!",4000)}
  else geckoSay('Zzz',4000);
}

/* ----- Gecko: Posen und Sprechblase ----- */
function gkBlink(){
  var g=SCENE.refs&&SCENE.refs.gk;if(!g)return;
  clearTimeout(SCENE.blinkT);
  g.classList.remove('blink');void g.getBoundingClientRect();
  g.classList.add('blink');
  SCENE.blinkT=setTimeout(function(){g.classList.remove('blink')},200);
}
function gkClearOnce(){
  clearTimeout(SCENE.onceT);
  if(SCENE.once&&SCENE.refs)SCENE.refs.gk.classList.remove(SCENE.once);
  SCENE.once='';
}
function geckoDo(name){
  if(!GK_ONCE[name]||!scWant())return;
  sceneEl();
  var g=SCENE.refs.gk;
  gkClearOnce();
  void g.getBoundingClientRect();
  g.classList.add(name);SCENE.once=name;
  SCENE.onceT=setTimeout(gkClearOnce,GK_ONCE[name]);
}
function gkHide(){
  clearTimeout(SCENE.bubT);clearTimeout(SCENE.bubClr);
  var b=SCENE.refs&&SCENE.refs.bub;if(!b)return;
  b.classList.remove('on');
  SCENE.bubClr=setTimeout(function(){if(!b.classList.contains('on'))b.textContent=''},300);
}
function geckoSay(text,ms){
  if(!SCENE.cfg.talk||!scWant())return;
  sceneEl();
  var b=SCENE.refs.bub;
  clearTimeout(SCENE.bubT);clearTimeout(SCENE.bubClr);
  b.textContent=text;
  if(b.classList.contains('on')){b.classList.remove('on');void b.offsetWidth}
  b.classList.add('on');
  SCENE.bubT=setTimeout(gkHide,ms||3500);
  SCENE.lastSay=Date.now();
}

/* ----- Gecko-Verhalten in der Fahrt ----- */
function gkHigh(i){
  var st=RIDE&&RIDE.steps[i];if(!st)return false;
  var k=zoneOf(stepFrac(st,RIDE.ftp)).k;
  return k==='Z4'||k==='Z5'||k==='Z6';
}
function gkLastHigh(){var i;for(i=RIDE.steps.length-1;i>=0;i--)if(gkHigh(i))return i;return -1}
function scVeil(){
  var st=RIDE&&RIDE.steps[RIDE.i];
  SCENE.veil=st?(SC_VEIL[zoneOf(stepFrac(st,RIDE.ftp)).k]||0):0;
  scApplyVeil();
}
function sceneStart(){
  if(!RIDE)return;
  var now=Date.now();
  sceneSetMode('ride');
  GK={i:RIDE.i,half:false,five:false,low:0,lock:0,idle:now+scRnd(50000,90000),talk:now+scRnd(240000,360000)};
  if(gkHigh(RIDE.i))scState('band',true);
  geckoDo('wave');geckoSay("Los geht's!");
}
function sceneToggle(first){
  if(!RIDE||first)return;
  if(RIDE.run){scState('sleep',false);geckoDo('wave');geckoSay("Weiter geht's!")}
  else{scState('sleep',true);geckoSay('Zzz …')}
}
function sceneFinish(){sceneSetMode('sum')}
function sceneClose(){
  scState('band',false);scState('sleep',false);scState('cheer',false);
  gkClearOnce();gkHide();
  SCENE.mode='';SCENE.demo=false;SCENE.veil=0;scApplyVeil();
  GK=null;
}
function sceneTick(){geckoTick()}
function geckoTick(){
  var R=RIDE;if(!R||R.done||!GK)return;
  var now=Date.now(),fired=false,prev,c;
  scVeil();
  if(!R.run){GK.low=0;return}
  if(R.i!==GK.i){
    prev=GK.i;GK.i=R.i;fired=true;
    if(gkHigh(R.i)){
      scState('band',true);geckoDo('wow');
      geckoSay(R.i===gkLastHigh()?'Das letzte! Gib alles!':scPick(["Jetzt gilt's!",'Volle Kraft!','Du packst das!']));
    }else{
      scState('band',false);
      if(gkHigh(prev)){geckoDo('jump');geckoSay(scPick(['Wow!','Stark!','Geschafft!']))}
    }
  }
  c=IND.live.cadence;
  if(c!=null&&c<60)GK.low++;else GK.low=0;
  if(!fired&&GK.low>=8&&now>=GK.lock){
    fired=true;GK.low=0;GK.lock=now+60000;
    geckoDo('tap');geckoSay(scPick(['Schneller treten!','Kurbel drehen!']));
  }
  if(!fired&&!GK.half&&R.el>R.total/2){GK.half=true;fired=true;geckoDo('thumbs');geckoSay('Halbzeit!')}
  if(!fired&&!GK.five&&R.total>=900&&R.total-R.el<=300){GK.five=true;fired=true;geckoSay('Noch 5 Minuten!')}
  if(!fired&&now>=GK.idle){
    fired=true;GK.idle=now+scRnd(50000,90000);
    geckoDo(scPick(['lick','eat','wave','thumbs']));
  }
  if(!fired&&now>=GK.talk&&now-SCENE.lastSay>=20000){
    GK.talk=now+scRnd(240000,360000);
    geckoSay(scPick(['Schöner Tritt!','Trinken nicht vergessen 💧','Sub 9, wir kommen!','Läuft bei dir!','Ich bin stolz auf dich!']));
  }
}

/* ---------- Ansicht ---------- */
function renderIndoor(){
  var el=$('#view-indoor');if(!el)return;
  var head='<div><p class="eyebrow">Training</p><h2 class="vh">Indoor-Trainer</h2></div>';
  if(RIDE&&!RIDE.done)el.innerHTML=head+rideHtml()+devicesHtml()+logHtml();
  else if(RIDE)el.innerHTML=head+summaryHtml()+logHtml();
  else el.innerHTML=head+savedHtml()+devicesHtml()+workoutHtml()+freeErgHtml()+logHtml();
  sceneMount();
}
function devicesHtml(){
  var T=IND.trainer,R=IND.hr,v=indVals(),o='';
  if(!BT_OK)o+='<div class="notice"><p>Bluetooth ist hier nicht verfügbar. Nutze Chrome oder Edge am Laptop. Safari und Firefox unterstützen Web Bluetooth nicht.</p></div>';
  if(IND.blocked)o+='<div class="notice"><p>Der Browser blockiert Bluetooth auf dieser Seite. Prüfe in den Website-Einstellungen von Chrome, ob Bluetooth erlaubt ist.</p></div>';
  o+='<div class="panel"><h3>Smart-Trainer</h3><p class="in-st">'+(IND.busy==='trainer'?'verbindet …':T?'verbunden mit <b>'+h(T.device.name||'Unbekannt')+'</b>':'nicht verbunden')+'</p>'+
    (T?'<div class="row"><button type="button" class="btn" data-act="inDiscT">Trennen</button></div>':
      '<div class="row"><button type="button" class="btn primary" data-act="inConnT"'+(BT_OK&&IND.busy!=='trainer'?'':' disabled')+'>Verbinden</button></div>')+'</div>';
  o+='<div class="panel"><h3>Pulsgurt</h3><p class="in-st">'+(IND.busy==='hr'?'verbindet …':R?'verbunden mit <b>'+h(R.device.name||'Unbekannt')+'</b>':'nicht verbunden')+'</p>'+
    (R?'<div class="row"><button type="button" class="btn" data-act="inDiscH">Trennen</button></div>':
      '<div class="row"><button type="button" class="btn primary" data-act="inConnH"'+(BT_OK&&IND.busy!=='hr'?'':' disabled')+'>Verbinden</button></div>')+'</div>';
  o+='<div class="tiles">'+
    '<div class="tile"><span class="k">Leistung</span><span class="v"><span id="inPow">'+v.inPow+'</span><small>W</small></span></div>'+
    '<div class="tile"><span class="k">Trittfrequenz</span><span class="v"><span id="inCad">'+v.inCad+'</span><small>rpm</small></span></div>'+
    '<div class="tile"><span class="k">Geschwindigkeit</span><span class="v"><span id="inSpd">'+v.inSpd+'</span><small>km/h</small></span></div>'+
    '<div class="tile"><span class="k">Puls</span><span class="v"><span id="inHr">'+v.inHr+'</span><small>bpm</small></span></div>'+
    '</div>';
  return o;
}
function workoutHtml(){
  var o='<div class="panel wo-panel"><h3>Workout</h3>'+
    '<div class="row"><label for="woFtp">FTP</label><input id="woFtp" type="number" min="80" max="600" step="1" class="dt-in" style="width:90px" value="'+h(WO.ftp)+'"><span>W</span></div>'+
    '<div class="wo-list">';
  WORKOUTS.forEach(function(w){
    var p=parseWorkout(w.text),on=!!WO.sel&&WO.sel.name===w.name;
    o+='<button type="button" class="wo-card" data-act="woPick" data-v="'+h(w.id)+'" aria-pressed="'+(on?'true':'false')+'"><b>'+h(w.name)+'</b><span>'+fmtClock(p.total)+' · Ø '+woAvg(p.steps,WO.ftp)+' % FTP</span>'+woGraph(p.steps,p.total,WO.ftp,{})+'</button>';
  });
  o+='</div>'+
    '<details'+(WO.err?' open':'')+'><summary>Eigenes Workout</summary>'+
    '<textarea id="woText" class="dt-in" aria-label="Eigenes Workout">'+h(WO.text)+'</textarea>'+
    '<p class="note">Beispiel: 10m 50%, 3x(12m 90%, 4m 55%), 10m 50%. Prozent beziehen sich auf deine FTP, alternativ Watt wie 200W. Rampen: 10m 50-70%.</p>'+
    '<div class="row"><button type="button" class="btn" data-act="woCustom">Übernehmen</button></div>'+
    (WO.err?'<p class="err">'+h(WO.err)+'</p>':'')+
    '</details>';
  if(WO.sel){
    var sl=WO.sel,lis=sl.steps.slice(0,40).map(function(st){
      return '<li>'+fmtClock(st.dur)+' · '+woPctTxt(st)+' · '+woWattTxt(st)+' · '+zoneOf(stepFrac(st,WO.ftp)).l+'</li>';
    });
    if(sl.steps.length>40)lis.push('<li>… und '+(sl.steps.length-40)+' weitere</li>');
    o+='<h3>'+h(sl.name)+'</h3>'+
      '<p class="explain">Dauer '+fmtClock(sl.total)+' · Ø '+woAvg(sl.steps,WO.ftp)+' % FTP</p>'+
      woGraph(sl.steps,sl.total,WO.ftp,{id:'wogSel'})+
      '<ol class="wo-steps">'+lis.join('')+'</ol>'+
      '<div class="row"><button type="button" class="btn primary" data-act="woStart">Workout starten</button></div>';
  }
  o+=scSlot()+'<div class="row"><button type="button" class="btn" data-act="scDemo" aria-pressed="'+(SCENE.demo?'true':'false')+'">Gecko-Vorschau</button></div></div>';
  return o;
}
function freeErgHtml(){
  var T=IND.trainer,cpOk=!!(T&&T.cp),ergDis=cpOk?'':' disabled',o='';
  o+='<div class="panel"><h3>Freies ERG</h3><p class="explain">Setzt eine feste Wattzahl. Der Trainer passt den Widerstand automatisch an, egal wie schnell du trittst.</p>'+
    '<div class="row"><button type="button" class="ibtn" data-act="inStep" data-v="-10" aria-label="10 Watt weniger"'+ergDis+'>−10</button>'+
    '<input id="inTarget" type="number" min="50" max="1000" step="5" inputmode="numeric" class="dt-in" value="'+h(isFinite(IND.target)?String(IND.target):'')+'" aria-label="Zielleistung in Watt">'+
    '<button type="button" class="ibtn" data-act="inStep" data-v="10" aria-label="10 Watt mehr"'+ergDis+'>+10</button>'+
    '<span>W</span>'+
    '<button type="button" class="btn primary" data-act="inErg"'+ergDis+'>'+(IND.erg?'Ziel senden':'ERG starten')+'</button>'+
    (IND.erg?'<button type="button" class="btn" data-act="inErgOff"'+ergDis+'>ERG beenden</button>':'')+'</div>'+
    '<p class="in-st">'+(IND.erg?'ERG aktiv: <b>'+h(IND.ergW)+' W</b>':'ERG aus')+'</p></div>';
  return o;
}
function logHtml(){
  var o='';
  o+='<div class="panel"><h3>Protokoll</h3>'+
    (IND.log.length?'<ul class="in-log">'+IND.log.map(function(e){return '<li><span>'+h(e.t)+'</span>'+h(e.m)+'</li>'}).join('')+'</ul>':'<p class="muted">Noch keine Ereignisse.</p>')+
    '<p class="note">Schließe Zwift und andere Apps, die mit der Rolle verbunden sind. Die Rolle kann nur mit einer App gleichzeitig verbunden sein.</p></div>';
  return o;
}

/* ---------- Events ---------- */
document.addEventListener('click',function(ev){
  var t=ev.target.closest('[data-act]');if(!t)return;var act=t.dataset.act;
  var ae=document.activeElement;if(ae&&DEFER_IDS.indexOf(ae.id)>=0&&ae!==t)ae.blur();
  if(act==='inConnT')return indConnTrainer();
  if(act==='inConnH')return indConnHr();
  if(act==='inDiscT')return indDisc('trainer');
  if(act==='inDiscH')return indDisc('hr');
  if(act==='inErg')return indErg();
  if(act==='inErgOff')return indErgOff();
  if(act==='inStep')return indStep(Number(t.dataset.v));
  if(act==='woPick')return woPick(t.dataset.v);
  if(act==='woCustom')return woCustom();
  if(act==='woStart')return rideStart();
  if(act==='rideToggle')return rideToggle();
  if(act==='rideBias')return rideBias(Number(t.dataset.v));
  if(act==='rideSkip')return rideSkip();
  if(act==='rideStop')return rideStop();
  if(act==='rideClose')return rideClose();
  if(act==='rideFit')return rideFit();
  if(act==='scOn')return scToggle('on');
  if(act==='scTalk')return scToggle('talk');
  if(act==='scDemo'){SCENE.demo=!SCENE.demo;return render()}
  if(act==='savedFit'){if(SAVED)fitDownload(SAVED.samples,SAVED.ftp,SAVED.startTs);return}
  if(act==='savedDrop'){rideDropKey();SAVED=null;render();return}
});
document.addEventListener('input',function(ev){if(ev.target&&ev.target.id==='inTarget')IND.target=ev.target.value===''?NaN:Number(ev.target.value)});
document.addEventListener('input',woInput);
woInit();
rideRestore();
render();
})();
</script>
</body>
</html>
